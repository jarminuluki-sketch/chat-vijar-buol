<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Video Call Face to Face</title>
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 950px; }
    .hidden { display: none !important; }
    .input-group { margin-bottom: 12px; }
    input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
    .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin-top: 5px; }
    .btn-primary { background-color: #007bff; }
    .btn-secondary { background-color: #6c757d; }
    .btn-success { background-color: #28a745; }
    .btn-warning { background-color: #ffc107; color: #000; }
    .btn-danger { background-color: #dc3545; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    
    /* Layout User Grid */
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
    .user-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; text-align: center; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .user-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; border: 2px solid #007bff; }
    .user-card h4 { margin: 5px 0 3px 0; font-size: 15px; }
    .user-card p { margin: 0; font-size: 12px; color: #666; }
    .card-actions { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }

    /* Video Call Overlay / Grid Face to Face */
    .f2f-video-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    @media (max-width: 600px) { .f2f-video-container { grid-template-columns: 1fr; } }
    .video-card { background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }

    /* Chat Area */
    #chat-box { height: 150px; border: 1px solid #ddd; border-radius: 6px; overflow-y: auto; padding: 10px; background: #fafafa; margin-bottom: 10px; }
    .msg { margin-bottom: 6px; word-break: break-all; }
    .controls-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; padding: 10px; background: #eee; border-radius: 8px; }
    .status-info { font-size: 12px; color: #28a745; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Aplikasi Obrolan & Panggilan Video (Face to Face)</h2>

  <!-- SEKSI AUTH & REGISTRASI -->
  <div id="authSection">
    <h3>Masuk / Daftar Akun</h3>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="authUsername" placeholder="Masukkan username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="Masukkan password">
    </div>
    <button class="btn btn-primary" onclick="login()">Masuk (Login)</button>
    <button class="btn btn-secondary" onclick="register()">Daftar Akun Baru</button>
    
    <hr style="margin: 20px 0;">
    <p style="text-align: center; color: #666;">Atau masuk langsung menggunakan Google:</p>
    <div style="display: flex; justify-content: center;">
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </div>

  <!-- SEKSI FORM PROFIL (NAMA, UMUR, TAHUN LAHIR, FOTO) -->
  <div id="profileSection" class="hidden">
    <h3>Lengkapi Data Profil</h3>
    <div class="input-group">
      <label>Nama Lengkap</label>
      <input type="text" id="profFullName" placeholder="Nama Lengkap">
    </div>
    <div class="input-group">
      <label>Umur</label>
      <input type="number" id="profAge" placeholder="Contoh: 25">
    </div>
    <div class="input-group">
      <label>Tahun Lahir</label>
      <input type="number" id="profBirthYear" placeholder="Contoh: 2001">
    </div>
    <div class="input-group">
      <label>Upload Foto Profil</label>
      <input type="file" id="profPhotoInput" accept="image/*">
      <div id="uploadStatus" class="status-info"></div>
    </div>
    <button id="btnSaveProfile" class="btn btn-success" onclick="saveProfile()">Simpan & Lanjutkan</button>
  </div>

  <!-- SEKSI UTAMA (DAFTAR USER, CHAT & CALL FACE TO FACE) -->
  <div id="mainSection" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <p>Halo, <b id="displayUsername" style="color: #007bff;"></b></p>
      <button class="btn btn-secondary" onclick="editProfile()">Edit Profil</button>
    </div>

    <!-- TAMPILAN PANGGILAN FACE TO FACE (JIKA CALL AKTIF) -->
    <div id="callContainer" class="hidden">
      <div class="controls-bar">
        <button id="btnMuteMic" class="btn btn-warning" onclick="toggleMic()">Mute Mic</button>
        <button id="btnMuteCam" class="btn btn-warning" onclick="toggleCam()">Matikan Kamera</button>
        <button class="btn btn-danger" onclick="endCall()">Akhiri Panggilan</button>
      </div>

      <div class="f2f-video-container">
        <div class="video-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-label">Saya (Lokal)</div>
        </div>
        <div class="video-card">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label" id="remoteLabel">Lawan Bicara</div>
        </div>
      </div>
    </div>

    <!-- DAFTAR USER AKTIF (KLIK FOTO UNTUK CALL/CHAT) -->
    <h3>Daftar Pengguna Online</h3>
    <div id="userGrid" class="user-grid"></div>

    <!-- CHAT BOX 1-ON-1 -->
    <h3 id="chatTargetHeader">Obrolan Teks</h3>
    <div id="chat-box"></div>
    <div class="input-group" style="display: flex; gap: 10px;">
      <input type="text" id="msgInput" placeholder="Tulis pesan..." onkeypress="if(event.key==='Enter') sendPrivateMessage()">
      <button class="btn btn-primary" onclick="sendPrivateMessage()">Kirim</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
