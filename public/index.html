<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP Chat dan VC</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- 1. LANDING / WELCOME SCREEN -->
  <div id="welcomeSection">
    <div class="welcome-card">
      <div class="welcome-banner">
        <video autoplay loop muted playsinline class="welcome-img">
          <source src="welcome-banner.mp4" type="video/mp4">
          Browser Anda tidak mendukung pemutaran video.
        </video>
      </div>

      <h2>Selamat Datang!</h2>
      <p>Nikmati kemudahan berkomunikasi secara real-time melalui obrolan teks dan panggilan video interaktif dalam satu aplikasi.</p>
      
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
