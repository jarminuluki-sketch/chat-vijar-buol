<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Obrolan & Panggilan Video</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome / RemixIcon untuk Ikon Modern -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- LAYER AUTHENTICATION (LOGIN) -->
  <div id="authSection" class="auth-container">
    <h2>Masuk / Daftar Akun</h2>
    <input type="text" id="authUsername" placeholder="Masukkan username">
    <input type="password" id="authPassword" placeholder="Masukkan password">
    <button class="btn btn-primary" onclick="login()">Masuk (Login)</button>
    <button class="btn btn-secondary" onclick="register()">Daftar Baru</button>
  </div>

  <!-- LAYER APLIKASI UTAMA (SETELAH LOGIN) -->
  <div id="mainSection" class="app-main hidden">

    <!-- TAB 1: JELAJAHI / BERANDA (Gambar 3) -->
    <div id="tab-home" class="tab-content active">
      <div class="header-nav">
        <span class="active-title">Jelajahi</span>
        <span class="sub-title">🔥 Populer</span>
      </div>
      
      <!-- Grid Pengguna Online -->
      <div class="user-grid-cards" id="userGrid">
        <!-- Kartu pengguna dimasukkan via JavaScript -->
      </div>
    </div>

    <!-- TAB 2: PANGGILAN VIDEO / MATCH (Gambar 2) -->
    <div id="tab-call" class="tab-content">
      <div class="call-preview-screen">
        <div class="coin-badge"><i class="ri-coin-line"></i> <span id="userCoins">0</span></div>
        <div class="video-preview-box">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-overlay">
            <button class="btn-start-call" onclick="startRandomCall()">
              <i class="ri-video-chat-fill"></i> Mulai Call
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 3: OBROLAN / CHAT -->
    <div id="tab-chat" class="tab-content">
      <div class="header-nav">
        <span class="active-title">Pesan</span>
      </div>
      <div id="chat-box" class="chat-container"></div>
      <div class="chat-input-row">
        <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()"><i class="ri-send-plane-fill"></i></button>
      </div>
    </div>

    <!-- TAB 4: PROFIL SAYA (Gambar 1) -->
    <div id="tab-profile" class="tab-content">
      <div class="profile-header">
        <img id="myAvatar" src="https://via.placeholder.com/80" class="avatar-img" alt="Avatar">
        <div class="profile-info">
          <h3 id="displayUsername">Nama User</h3>
          <span class="badge-tag">♂ 18</span>
          <span class="badge-tag">Indonesia</span>
        </div>
      </div>

      <!-- Card Koin -->
      <div class="coin-card">
        <div class="coin-balance">
          <i class="ri-coin-fill gold-icon"></i>
          <span id="profileCoins">0</span>
        </div>
        <button class="btn-get-coins">Dapatkan</button>
      </div>

      <!-- Card VIP -->
      <div class="vip-card">
        <span>👑 Bling VIP</span>
        <span class="bonus-link">Bonus gratis &gt;</span>
      </div>

      <!-- Menu Grid -->
      <div class="menu-grid">
        <div class="menu-item"><i class="ri-gift-line"></i><span>Bonusnya</span></div>
        <div class="menu-item"><i class="ri-wallet-3-line"></i><span>Credits</span></div>
        <div class="menu-item"><i class="ri-box-3-line"></i><span>Kemasan</span></div>
        <div class="menu-item"><i class="ri-star-line"></i><span>Tingkat</span></div>
        <div class="menu-item"><i class="ri-user-add-line"></i><span>Undang</span></div>
      </div>

      <button class="btn-logout" onclick="logout()">Keluar Akun</button>
    </div>

    <!-- BOTTOM NAVIGATION BAR (NAVIGASI BAWAH) -->
    <div class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home', this)">
        <i class="ri-home-5-line"></i>
      </button>
      <button class="nav-item" onclick="switchTab('call', this)">
        <i class="ri-video-download-line"></i>
      </button>
      <button class="nav-item" onclick="switchTab('chat', this)">
        <i class="ri-chat-3-line"></i>
      </button>
      <button class="nav-item" onclick="switchTab('profile', this)">
        <i class="ri-user-3-line"></i>
      </button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    // Fungsi untuk Pindah Tab Menu Bawah
    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
    }
  </script>
</body>
</html>
<!-- NAVIGASI BAWAH (BOTTOM NAVBAR) -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('explore')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Jelajahi</span>
  </button>
  <button class="nav-item" onclick="switchTab('video-match')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    <span>Video</span>
  </button>
  <button class="nav-item" onclick="switchTab('chat')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
    <span>Obrolan</span>
  </button>
  <button class="nav-item" onclick="switchTab('profile')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>Saya</span>
  </button>
</nav>
